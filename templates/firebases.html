<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gold Drop Checker - Firebase Links</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar { background: #1e293b; padding: 16px 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #334155; }
        .navbar h1 { font-size: 20px; color: #38bdf8; }
        .navbar a { color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }
        .navbar a:hover, .navbar a.active { color: #e2e8f0; background: #334155; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        textarea { width: 100%; height: 400px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 12px; padding: 16px; font-family: 'Cascadia Code', monospace; font-size: 13px; resize: vertical; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        .btn { padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: #38bdf8; color: #0f172a; margin-top: 12px; }
        .btn:hover { background: #0ea5e9; }
        .info { color: #94a3b8; margin-bottom: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 Gold Drop Checker</h1>
        <a href="/">Dashboard</a>
        <a href="/logs">Logs</a>
        <a href="/hits">Hits</a>
        <a href="/firebases" class="active">Firebase</a>
        <a href="/settings">Settings</a>
    </nav>
    <div class="container">
        <h2 style="margin-bottom:8px;">Firebase Links ({{ links|length }})</h2>
        <p class="info">One Firebase URL per line. These are the databases to scan for phone numbers.</p>
        <textarea id="links">{% for idx, link in links %}{{ link }}
{% endfor %}</textarea>
        <button class="btn" onclick="saveLinks()">💾 Save Links</button>
    </div>
    <script>
        function saveLinks() {
            const links = document.getElementById('links').value;
            fetch('/api/update-links', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({links})
            }).then(r=>r.json()).then(d=>{
                alert('Links saved!');
                location.reload();
            });
        }
    </script>
</body>
</html>
