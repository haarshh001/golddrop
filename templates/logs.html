<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gold Drop Checker - Logs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar { background: #1e293b; padding: 16px 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid #334155; }
        .navbar h1 { font-size: 20px; color: #38bdf8; }
        .navbar a { color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; }
        .navbar a:hover, .navbar a.active { color: #e2e8f0; background: #334155; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .log-box { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; font-family: 'Cascadia Code', monospace; font-size: 13px; max-height: 80vh; overflow-y: auto; }
        .log-box div { padding: 2px 0; white-space: pre-wrap; word-break: break-all; }
        .WIN { color: #22c55e; font-weight: bold; }
        .NOREWARD { color: #fbbf24; }
        .HIT { color: #38bdf8; font-weight: bold; }
        .ERROR { color: #f87171; }
        .INFO { color: #94a3b8; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>🎯 Gold Drop Checker</h1>
        <a href="/">Dashboard</a>
        <a href="/logs" class="active">Logs</a>
        <a href="/hits">Hits</a>
        <a href="/firebases">Firebase</a>
        <a href="/manual">Manual</a>
        <a href="/settings">Settings</a>
    </nav>
    <div class="container">
        <h2 style="margin-bottom:16px;">Logs (auto-refresh)</h2>
        <div class="log-box" id="logbox"></div>
    </div>
    <script>
        function refreshLogs() {
            fetch('/api/logs').then(r=>r.json()).then(logs=>{
                const box = document.getElementById('logbox');
                box.innerHTML = logs.reverse().map(l => {
                    let cls = 'INFO';
                    if (l.includes('[ERROR]')) cls = 'ERROR';
                    else if (l.includes('[WIN]')) cls = 'WIN';
                    else if (l.includes('[NOREWARD]')) cls = 'NOREWARD';
                    else if (l.includes('[HIT]')) cls = 'HIT';
                    const safe = l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    return `<div class="${cls}">${safe}</div>`;
                }).join('');
            });
        }
        refreshLogs();
        setInterval(refreshLogs, 2000);
    </script>
</body>
</html>
